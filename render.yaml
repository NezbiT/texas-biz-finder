# TxBizFinder API on Render.
# Dashboard → New → Blueprint → this repo. Or attach this file to an existing service.
#
# After the first deploy, copy the service URL (https://<name>.onrender.com) into:
#   Cloudflare Worker secret API_ORIGIN
#   Vercel env NUXT_API_PROXY_URL
#   Vercel env NUXT_PUBLIC_ADMIN_API_KEY  (same value as ADMIN_API_KEY here)

services:
  - type: web
    name: texas-biz-finder
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: >-
      python -m uvicorn backend.app.main:app
      --host 0.0.0.0
      --port $PORT
      --workers 1
      --proxy-headers
      --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: production
      - key: ENABLE_WEBSITE_RESEARCH
        value: "false"
      - key: DATA_BACKEND
        value: sqlite
      - key: UVICORN_WORKERS
        value: "1"
      - key: DUCKDB_THREADS
        value: "1"
      - key: DUCKDB_MEMORY_LIMIT
        value: 512MB
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://www.txbizfinder.com","https://txbizfinder.com","https://txbizfinder-web.vercel.app","https://texas-biz-finder.vercel.app"]'
