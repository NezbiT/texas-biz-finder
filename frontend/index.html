<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0c1222" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8f6f2" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <title>TX BizFinder — Texas Business Leads</title>
    <meta name="description" content="Find and qualify Texas small businesses. TABC alcohol data, 500K+ leads. txbizfinder.com" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var t = localStorage.getItem("txbf-theme") || localStorage.getItem("tbf-theme");
        var dark = t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        var loc = localStorage.getItem("txbf-locale") || localStorage.getItem("tbf-locale");
        document.documentElement.lang = loc === "es" ? "es" : "en";
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
