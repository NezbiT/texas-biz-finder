[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "texasbizfinder"
version = "3.0.0"
description = "Find and qualify small Texas businesses without modern online presence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.0",
    "ddgs>=9.14.0",
    "playwright>=1.49.0",
    "duckdb>=1.1.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.0", "pytest-asyncio>=0.24.0", "pillow>=10.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.skylos]
# Vue SFC imports are not traced; composables/i18n/types are used from .vue files.
# Nuxt además auto-importa composables/ y config/, así que nada de eso se ve
# como "importado" en el análisis estático.
exclude = [
    "frontend-v2/app/composables",
    "frontend-v2/app/config",
    "frontend-v2/app/types",
    "frontend-v2/i18n",
    "archive",
]